<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>구월경희한의원 문진 결과 보기</title>
<meta name="robots" content="noindex,nofollow">
<style>
@page{size:A4;margin:10mm}
:root{--ink:#1c2422;--soft:#5b6662;--faint:#a3aca8;--line:#d3dad7;--accent:#2f6b57;--tint:#eaf3ef;--tint2:#f6f9f8;--pen:#1a4fb4;--hi:#fff4c2}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);background:#e9eeec;font-size:14px;line-height:1.45;word-break:keep-all}
.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:8px 16px;display:flex;gap:8px;align-items:center}
.bar .t{font-weight:800;color:var(--accent);margin-right:auto}
.bar button{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:6px 14px;font:inherit;font-weight:700;cursor:pointer}
.bar button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.paper{max-width:820px;margin:16px auto;background:#fff;padding:28px 34px 36px;box-shadow:0 2px 14px rgba(0,0,0,.08)}
.wait{max-width:820px;margin:60px auto;text-align:center;color:var(--soft)}
header.top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--accent);padding-bottom:8px;margin-bottom:10px}
.clinic{font-size:12px;color:var(--accent);font-weight:700}
h1{font-size:26px;font-weight:800;line-height:1.15}h1 small{font-size:14px;font-weight:500;color:var(--soft);margin-left:6px}
.when{text-align:right;font-size:12px;color:var(--soft)}
table.info{width:100%;border-collapse:collapse;margin-bottom:10px}
table.info th{background:var(--tint);color:var(--accent);font-weight:700;padding:5px 8px;border:1px solid var(--line);white-space:nowrap;width:1%;font-size:13px}
table.info td{border:1px solid var(--line);padding:5px 9px;color:var(--pen);font-weight:700}
.score{border:2px solid var(--accent);border-radius:10px;padding:10px 14px;margin:6px 0 14px;background:var(--tint2);display:flex;flex-wrap:wrap;gap:6px 22px}
.score div{font-size:13px;color:var(--soft)}.score b{font-size:18px;color:var(--ink);margin-left:6px}
.score .band b{color:#b4513d}
.score .note{flex-basis:100%;font-size:11.5px;color:var(--faint)}
section{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:10px;break-inside:avoid}
.sh{display:flex;align-items:center;gap:8px;background:var(--tint);padding:5px 12px;border-bottom:1px solid var(--line)}
.sh .no{background:var(--accent);color:#fff;font-weight:800;font-size:12px;border-radius:12px;padding:1px 9px}
.sh h3{font-size:15px;font-weight:800;color:var(--accent)}
.row{display:grid;grid-template-columns:170px 1fr;border-top:1px solid #edf1ef}.row:first-child{border-top:none}
.row .lb{padding:5px 10px;font-weight:700;color:#33403b;background:#fbfcfc;border-right:1px solid #edf1ef;font-size:13px}
.row .lb .n{color:var(--accent);margin-right:4px}
.row .an{padding:5px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:3px 12px}
.row.cl{display:block;padding:7px 10px}
.row.qn{grid-template-columns:1fr 300px}.row.qn .lb{background:#fff;font-weight:600}
.checks{display:grid;grid-template-columns:repeat(3,1fr);gap:3px 14px}
.ck,.chip{display:inline-flex;align-items:flex-start;gap:5px;color:var(--faint)}
i.cb{flex:none;display:inline-block;width:15px;height:15px;border:1.4px solid #b9c2be;border-radius:3px;margin-top:2px;position:relative;background:#fff}
.on{color:var(--ink);font-weight:800}
.on i.cb{border-color:var(--pen);background:#fff}
.on i.cb::after{content:"✓";position:absolute;left:1px;top:-6px;font-size:17px;font-weight:900;color:var(--pen)}
.on span{background:linear-gradient(transparent 55%,var(--hi) 55%)}
.txt{color:var(--pen);font-weight:700;border-bottom:1px solid #9aa6a0;min-width:120px;padding:0 4px;white-space:pre-wrap}
.txt.empty{color:var(--faint);font-weight:400;border-bottom-style:dashed}
.nrs{display:flex;gap:4px}.nrs span{width:24px;height:24px;border:1px solid #c9d1cd;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--faint)}
.nrs span.on{border:2px solid var(--pen);color:var(--pen);background:var(--hi)}
table.pt{width:100%;border-collapse:collapse}
table.pt th{background:var(--accent);color:#fff;padding:4px;font-size:14px}
table.pt td{border:1px solid var(--line);padding:5px 9px;vertical-align:top;width:50%}
table.pt td .ck{display:flex;margin:2px 0}
table.pt tr.sub td{background:var(--tint);color:var(--accent);font-weight:800}
.emo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}
.emo div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--faint)}
.emo div b{display:block;color:var(--soft)}
.emo div.near{border:2px solid var(--accent);background:var(--tint);color:var(--ink)}.emo div.near b{color:var(--accent)}
.emo div.far{border:2px solid #8a4560;background:#f6eff1;color:var(--ink)}.emo div.far b{color:#8a4560}
.emo em{font-style:normal;font-size:11px;font-weight:800;float:right}
body.only .chip:not(.on),body.only .ck:not(.on),body.only .nrs span:not(.on),body.only .emo div:not(.near):not(.far){display:none}
body.only .row.blank,body.only section.blank{display:none}
.sum{max-width:820px;margin:16px auto 0;background:#fff;border:2px solid var(--accent);border-radius:10px;padding:12px 16px}
.sum .h{display:flex;align-items:center;gap:8px;margin-bottom:8px}.sum .h b{color:var(--accent);font-size:15px;margin-right:auto}
.sum .h button{border:none;background:var(--accent);color:#fff;border-radius:8px;padding:6px 16px;font:inherit;font-weight:800;cursor:pointer}
.sum textarea{width:100%;min-height:260px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:13px/1.55 "Malgun Gothic","Noto Sans KR",sans-serif;color:var(--ink);resize:vertical}
.sum .flag{background:#fdecea;color:#a3271b;border-radius:6px;padding:6px 10px;font-weight:800;margin-bottom:8px}
@media print{.sum{display:none}}
.viz{border:2px solid var(--accent);border-radius:12px;padding:14px 16px 12px;margin:6px 0 14px;background:#fff;break-inside:avoid}
.viz h4{font-size:15px;color:var(--accent);margin-bottom:2px}.viz .big{font-size:30px;font-weight:900;line-height:1.1}.viz .big small{font-size:14px;color:var(--soft);font-weight:600;margin-left:4px}
.viz .lvl{display:inline-block;margin-left:10px;padding:2px 12px;border-radius:14px;color:#fff;font-weight:800;font-size:15px;vertical-align:6px}
.gauge{position:relative;margin:30px 0 4px;height:22px;display:flex;border-radius:6px;overflow:visible}
.gauge .seg{height:100%;position:relative}.gauge .seg:first-child{border-radius:6px 0 0 6px}.gauge .seg:last-child{border-radius:0 6px 6px 0}
.gauge .mk{position:absolute;top:-26px;transform:translateX(-50%);font-weight:900;font-size:13px;white-space:nowrap;text-align:center}
.gauge .mk::after{content:"";display:block;margin:1px auto 0;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--ink)}
.gauge .pin{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--ink);transform:translateX(-50%);border-radius:2px}
.ticks{position:relative;height:16px;font-size:11px;color:var(--soft);margin-bottom:8px}.ticks span{position:absolute;transform:translateX(-50%)}
.bands{display:grid;gap:5px;margin-top:6px}
.bands div{display:grid;grid-template-columns:185px 1fr;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--soft)}
.bands div b{display:flex;align-items:center;gap:6px;color:var(--ink)}.bands div b i{flex:none;width:12px;height:12px;border-radius:3px}
.bands div.cur{border:2px solid var(--ink);color:var(--ink);background:#fbfbf6}.bands div.cur b::after{content:"◀ 현재";font-size:11px;color:#b4513d;margin-left:auto}
.subs{display:grid;gap:6px;margin-top:12px}.subs .r{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.subs .sbar{height:12px;background:#edf1ef;border-radius:6px;overflow:hidden}.subs .sbar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.subs .r span:last-child{text-align:right;font-weight:800}
.viz .src{font-size:11px;color:var(--faint);margin-top:8px}
@media print{body{background:#fff}.bar{display:none}.paper{box-shadow:none;margin:0;max-width:none;padding:0}}
</style>
</head>

      const opts=num[0].opts||[];
      if(opts.every(o=>/^\d+$/.test(o))){const s=num.filter(it=>g(it.h)).map(it=>`${it.n}번 ${strip(g(it.h))}`);if(s.length)parts.push(s.join(', '))}
      else{const by={};num.forEach(it=>{const v=strip(g(it.h));if(v)(by[v]=by[v]||[]).push(it.n)});const s=opts.filter(o=>by[o]).map(o=>`${o} ${by[o].join(',')}`);const miss=num.filter(it=>!g(it.h)).map(it=>it.n);if(miss.length)s.push('미응답 '+miss.join(','));if(s.length)parts.push('문항별 - '+s.join(' / '))}
    }
    if(parts.length)L.push(`${G.key}) `+parts.join(' / '));
  });
  if(F.pers){
    const A=[],B=[];F.pers.forEach(p=>{const sel=list0(M,p.h,[...p.a,...p.b]);sel.forEach(o=>{if(p.a.includes(o))A.push(o);else if(p.b.includes(o))B.push(o)})});
    if(A.length||B.length){L.push('성격) 陽쪽: '+(A.join(', ')||'-'));L.push('  陰쪽: '+(B.join(', ')||'-'));}
    const y=g('19. 평소 성격 | 陽 선택 수'),n=g('19. 평소 성격 | 陰 선택 수');if(y||n)L.push(`  陽 ${y||0} / 陰 ${n||0}`);
  }
  if(F.emo){const nr=g(F.emo.near),fr=g(F.emo.far);if(nr||fr){L.push('감정) 가깝다: '+(nr||'-'));L.push('  멀다: '+(fr||'-'))}}
  return {text:L.join('\n').replace(/\n{3,}/g,'\n\n').trim(),flags};
}
function list0(M,h,opts){const v=M[h];if(!v)return [];const s=', '+String(v).trim().split(', ').map(strip).join(', ')+', ';return opts.filter(o=>s.includes(', '+o+', '))}

function gaugeHTML(form,M){
  const G=GAUGES[form];if(!G)return '';
  const raw=M[G.h];const v=raw==null||String(raw).trim()===''?null:parseFloat(String(raw));
  if(v==null||isNaN(v))return '';
  const span=G.max-G.min,pct=x=>Math.max(0,Math.min(100,(x-G.min)/span*100));
  const n=G.bands.length,col=i=>n===2?[GC[0],GC[4]][i]:n===3?[GC[0],GC[2],GC[4]][i]:GC[i];
  let cur=G.bands.findIndex((b,i)=>v<=b[1]||i===n-1);
  let seg='';G.bands.forEach((b,i)=>{const lo=i?G.bands[i-1][1]:G.min,hi=b[1];seg+=`<div class="seg" style="width:${(hi-lo)/span*100}%;background:${col(i)}"></div>`});
  const p=pct(v);
  let ticks=`<span style="left:0;transform:none">${G.min}</span>`+G.bands.slice(0,-1).map(b=>`<span style="left:${pct(b[1])}%">${b[1]}</span>`).join('')+`<span style="left:100%;transform:translateX(-100%)">${G.max}</span>`;
  let H=`<div class="viz"><h4>${esc(G.title)}</h4><div class="big">${v}<small>/ ${G.max}${G.unit}</small><span class="lvl" style="background:${col(cur)}">${esc(G.bands[cur][2])}</span></div>`;
  H+=`<div class="gauge">${seg}<div class="pin" style="left:${p}%"></div><div class="mk" style="left:${p}%">${v}${G.unit}</div></div><div class="ticks">${ticks}</div>`;
  H+='<div class="bands">'+G.bands.map((b,i)=>`<div class="${i===cur?'cur':''}"><b><i style="background:${col(i)}"></i>${esc(b[2])}</b><span>${b[0]===b[1]?b[0]:b[0]+'–'+b[1]}${G.unit} · ${esc(b[3])}</span></div>`).join('')+'</div>';
  if(G.subs){const rows=G.subs.map(([l,h,mx,u])=>{const s=parseFloat(M[h]);if(isNaN(s))return '';return `<div class="r"><span>${esc(l)}</span><div class="sbar"><i style="width:${Math.min(100,s/mx*100)}%"></i></div><span>${s} / ${mx}${u||''}</span></div>`}).join('');if(rows)H+=`<div class="subs">${rows}</div>`}
  return H+`<div class="src">${esc(G.src)}</div></div>`;
}
function render(form,M){
  const F=FORMS[form]; if(!F){document.getElementById('out').innerHTML='<div class="wait">이 탭은 문진 결과 보기 대상이 아닙니다.</div>';return}
  const g=h=>{const v=M[h];return v==null?'':String(v).trim()};
  const list=h=>{const v=g(h);return v?v.split(', ').map(strip):[]};
  const has=(h,o)=>{const v=g(h);return !!v&&(', '+v.split(', ').map(strip).join(', ')+', ').includes(', '+o+', ')};
  let H=`<div class="paper"><header class="top"><div><div class="clinic">구월경희한의원</div><h1>${esc(F.title)}${F.subtitle?` <small>${esc(F.subtitle)}</small>`:''}</h1></div><div class="when">제출 ${esc(g('제출 시각'))}${g('작성 장소')?'<br>'+esc(g('작성 장소')):''}</div></header>`;
  const info=F.info.filter(([l,h])=>l!=='작성 장소');
  H+='<table class="info"><tr>'+info.map(([l,h],i)=>`<th>${l}</th><td>${esc(g(h))}</td>${(i%3===2&&i<info.length-1)?'</tr><tr>':''}`).join('')+'</tr></table>';
  if(F.scores&&F.scores.length){H+='<div class="score">'+F.scores.map(([l,h])=>`<div class="${/판정/.test(l)?'band':''}">${esc(l)}<b>${esc(g(h))||'-'}</b></div>`).join('')+(F.note?`<div class="note">${esc(F.note)}</div>`:'')+'</div>'}
  H+=gaugeHTML(form,M);
  F.sections.forEach(s=>{
    let any=false,rows='';
    s.items.forEach(it=>{
      const v=g(it.h),lab=`${it.n!=null?`<span class="n">${it.n}.</span>`:''}${esc(it.text)}`;
      if(v)any=true;
      if(it.type==='checks'){const sel=it.opts.filter(o=>has(it.h,o));rows+=`<div class="row cl ${v?'':'blank'}"><div class="checks">`+it.opts.map(o=>`<span class="ck ${sel.includes(o)?'on':''}"><i class="cb"></i><span>${esc(o)}</span></span>`).join('')+'</div></div>'}
      else if(it.type==='single'||it.type==='multi'){const sel=it.type==='single'?(v?[strip(v)]:[]):it.opts.filter(o=>has(it.h,o));rows+=`<div class="row ${it.n!=null?'qn':''} ${v?'':'blank'}"><div class="lb">${lab}</div><div class="an">`+it.opts.map(o=>`<span class="chip ${sel.includes(o)?'on':''}"><i class="cb"></i><span>${esc(o)}</span></span>`).join('')+'</div></div>'}
      else if(it.type==='nrs'){rows+=`<div class="row ${v?'':'blank'}"><div class="lb">${lab}</div><div class="an"><div class="nrs">`+Array.from({length:11},(_,k)=>`<span class="${v!==''&&+v===k?'on':''}">${k}</span>`).join('')+'</div></div></div>'}
      else{rows+=`<div class="row ${v?'':'blank'}"><div class="lb">${lab}</div><div class="an"><span class="txt ${v?'':'empty'}">${v?esc(v):'(비어 있음)'}</span></div></div>`}
    });
    H+=`<section class="${any?'':'blank'}"><div class="sh"><span class="no">${esc(s.no)}</span><h3>${esc(s.title)}</h3></div>${rows}</section>`;
  });
  if(F.pers){
    let rows='',any=false;
    F.pers.forEach(p=>{const sel=[...p.a,...p.b].filter(o=>has(p.h,o));if(sel.length)any=true;const cell=a=>a.map(o=>`<span class="ck ${sel.includes(o)?'on':''}"><i class="cb"></i><span>${esc(o)}</span></span>`).join('');
      rows+=`<tr class="sub"><td colspan="2">${esc(p.text)}</td></tr><tr class="${sel.length?'':'blank'}"><td>${cell(p.a)}</td><td>${cell(p.b)}</td></tr>`});
    H+=`<section class="${any?'':'blank'}"><div class="sh"><span class="no">19</span><h3>평소 성격</h3></div><table class="pt"><thead><tr><th>陽</th><th>陰</th></tr></thead><tbody>${rows}</tbody></table></section>`;
  }
  if(F.emo){
    const near=F.emo.items.filter(o=>has(F.emo.near,o)),far=F.emo.items.filter(o=>has(F.emo.far,o));
    H+=`<section class="${near.length||far.length?'':'blank'}"><div class="sh"><span class="no">20</span><h3>나의 감정</h3></div><div class="emo">`+F.emo.items.map(n=>{const c=near.includes(n)?'near':far.includes(n)?'far':'';return `<div class="${c}">${c?`<em>${c==='near'?'가깝다':'멀다'}</em>`:''}<b>${esc(n)}</b>${esc(F.emo.desc[n]||'')}</div>`}).join('')+'</div></section>';
  }
  H+='</div>';
  const S=summary(form,M);
  const SH=`<div class="sum"><div class="h"><b>차트용 요약</b><button id="sumCopy" type="button">복사</button></div>${S.flags.length?`<div class="flag">※ 상담 시 확인: ${S.flags.map(esc).join(', ')}</div>`:''}<textarea id="sumTa" readonly>${esc(S.text)}</textarea></div>`;
  document.getElementById('out').innerHTML=SH+H;
  document.getElementById('sumCopy').onclick=copySum;
  const ta=document.getElementById('sumTa');ta.style.height=Math.min(ta.scrollHeight+4,620)+'px';
  document.title=`${g('성명')} ${F.title}`;
}
