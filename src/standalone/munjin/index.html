<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>구월경희한의원 한약 문진표</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#2f6b57">
<style>
:root{
  --ink:#1c2422; --soft:#5b6662; --faint:#8b9692; --line:#d6ddda; --bg:#f4f7f6; --card:#ffffff;
  --accent:#2f6b57; --accent-d:#24543f; --tint:#e7f2ed; --warn:#b4513d; --fs:18px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs)}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink);background:var(--bg);line-height:1.5;word-break:keep-all;min-height:100vh}
body.big,html.big{--fs:22px}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}

.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top .bar{display:flex;align-items:center;gap:.6rem;padding:.65rem 1rem .5rem}
.top .clinic{font-size:.72rem;font-weight:700;color:var(--accent);letter-spacing:.04em}
.top .ttl{font-size:.95rem;font-weight:800}
.top .grow{flex:1;min-width:0}
.fontbtn{flex:none;border:1.5px solid var(--line);border-radius:.6rem;padding:.25rem .6rem;font-size:.8rem;font-weight:700;color:var(--accent);background:#fff}
body.big .fontbtn{background:var(--tint);border-color:var(--accent)}
.prog{height:6px;background:#e4ebe8}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.stepno{font-size:.75rem;color:var(--faint);padding:0 1rem .45rem}

main{max-width:640px;margin:0 auto;padding:1rem 1rem 7.5rem}
.sec-h{margin:.4rem 0 1rem}
.sec-h .no{display:inline-flex;align-items:center;justify-content:center;min-width:1.9rem;height:1.9rem;border-radius:1rem;background:var(--accent);color:#fff;font-weight:800;font-size:.9rem;padding:0 .5rem;margin-bottom:.4rem}
.sec-h h2{font-size:1.45rem;line-height:1.3;font-weight:800}
.sec-h p{color:var(--soft);font-size:.9rem;margin-top:.3rem}

.q{background:var(--card);border:1px solid var(--line);border-radius:1rem;padding:1rem;margin-bottom:.85rem}
.q h3{font-size:1.05rem;font-weight:800;margin-bottom:.15rem}
.q .sub{font-size:.8rem;color:var(--faint);margin-bottom:.65rem}
.q .req{color:var(--warn);font-size:.8rem;font-weight:700;margin-left:.25rem}
.q.err{border-color:var(--warn);box-shadow:0 0 0 2px #f3d9d3}
.opts{display:flex;flex-wrap:wrap;gap:.5rem}
.opts.col{flex-direction:column}
.chip{display:flex;align-items:center;gap:.55rem;min-height:3rem;padding:.55rem .95rem .55rem .63rem;border:1.5px solid var(--line);border-radius:.8rem;background:#fff;text-align:left;font-size:1rem;line-height:1.35;transition:background .12s,border-color .12s}
.opts.col .chip{width:100%}
.chip .box{flex:none;width:1.35rem;height:1.35rem;border:2px solid #9aa6a1;border-radius:.35rem;display:flex;align-items:center;justify-content:center;background:#fff}
.chip.radio .box{border-radius:50%}
.chip[aria-pressed="true"]{background:var(--tint);border-color:var(--accent);font-weight:700}
.chip[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.chip[aria-pressed="true"] .box::after{content:"";width:.42rem;height:.75rem;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.chip.radio[aria-pressed="true"] .box::after{width:.55rem;height:.55rem;border:none;border-radius:50%;background:#fff;transform:none}
input.txt,textarea.txt{width:100%;border:1.5px solid var(--line);border-radius:.8rem;padding:.8rem .9rem;background:#fff;font-size:1rem;outline:none}
input.txt:focus,textarea.txt:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--tint)}
textarea.txt{min-height:5.5rem;resize:vertical}
.scale{display:grid;grid-template-columns:repeat(11,1fr);gap:.25rem}
.scale button{height:2.8rem;border:1.5px solid var(--line);border-radius:.55rem;background:#fff;font-weight:700;font-size:.95rem}
.scale button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.scale-l{display:flex;justify-content:space-between;font-size:.78rem;color:var(--faint);margin-top:.35rem}

.pair{display:grid;gap:.5rem}
.pair .or{text-align:center;font-size:.78rem;color:var(--faint);font-weight:700}

.emo .row{border-top:1px solid #edf1ef;padding:.8rem 0}
.emo .row:first-of-type{border-top:none;padding-top:.2rem}
.emo .name{font-weight:800}
.emo .desc{font-size:.82rem;color:var(--soft);margin:.1rem 0 .5rem}
.emo .btns{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.emo .btns button{min-height:2.8rem;border:1.5px solid var(--line);border-radius:.7rem;background:#fff;font-weight:700}
.emo .btns button.near[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.emo .btns button.far[aria-pressed="true"]{background:#8a4560;border-color:#8a4560;color:#fff}
.emo .count{font-size:.85rem;color:var(--soft);margin-top:.4rem}

.intro .hero{background:var(--card);border:1px solid var(--line);border-radius:1.1rem;padding:1.4rem 1.2rem;margin-bottom:.9rem}
.intro h1{font-size:1.6rem;line-height:1.3;font-weight:800;margin:.2rem 0 .6rem}
.intro .lead{color:var(--soft)}
.intro ul{list-style:none;margin-top:1rem;display:grid;gap:.55rem}
.intro li{display:flex;gap:.6rem;align-items:flex-start;font-size:.95rem}
.intro li b{flex:none;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--tint);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:.8rem}
.resume{background:#fff8e8;border:1.5px solid #e9cf8f;border-radius:1rem;padding:1rem;margin-bottom:.9rem}
.resume p{font-weight:700;margin-bottom:.7rem}
.resume .acts{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.consent{font-size:.88rem;color:var(--soft);background:#fafbfb;border:1px solid var(--line);border-radius:.7rem;padding:.75rem .85rem;margin-bottom:.7rem;line-height:1.6}

.foot{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:.7rem 1rem calc(.7rem + env(safe-area-inset-bottom))}
.foot .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr 2fr;gap:.6rem}
.foot .in.solo{grid-template-columns:1fr}
.btn{min-height:3.3rem;border-radius:.9rem;font-weight:800;font-size:1.05rem}
.btn.pri{background:var(--accent);color:#fff}
.btn.pri:active{background:var(--accent-d)}
.btn.sec{background:#fff;border:1.5px solid var(--line);color:var(--soft)}
.btn[disabled]{opacity:.55}
.saved{position:fixed;left:50%;bottom:5.4rem;transform:translateX(-50%) translateY(10px);background:#26302d;color:#fff;font-size:.8rem;padding:.35rem .8rem;border-radius:1rem;opacity:0;transition:.25s;pointer-events:none;z-index:7}
.saved.on{opacity:.92;transform:translateX(-50%)}
.msg{color:var(--warn);font-weight:700;font-size:.9rem;margin:.2rem 0 .8rem}
.done{text-align:center;padding:3rem 1rem}
.done .ok{width:4.5rem;height:4.5rem;border-radius:50%;background:var(--tint);color:var(--accent);font-size:2.2rem;display:flex;align-items:center;justify-content:center;margin:0 auto 1rem;font-weight:800}
.done h2{font-size:1.5rem;margin-bottom:.5rem}
.done p{color:var(--soft)}

/* 2026-10-22 피드백 반영: 목차 이동 · 하단 버튼 · 선택지 글씨 */
.stepno button{border:none;background:none;font:inherit;color:var(--accent);font-weight:700;padding:.1rem 0;text-decoration:underline;text-underline-offset:3px}
.nav-ov{position:fixed;inset:0;z-index:20;background:rgba(20,28,25,.5);display:flex;align-items:flex-end;justify-content:center}
.nav-box{background:#fff;width:100%;max-width:640px;max-height:80vh;overflow:auto;border-radius:1.1rem 1.1rem 0 0;padding:1rem 1rem calc(1rem + env(safe-area-inset-bottom))}
.nav-box h3{font-size:1.1rem;margin-bottom:.2rem}.nav-box .sub{font-size:.8rem;color:var(--faint);margin-bottom:.7rem}
.toc{display:grid;gap:.4rem}
.toc button{display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:.8rem;background:#fff;padding:.65rem .8rem;font:inherit;font-size:.95rem;color:var(--ink)}
.toc button .tn{flex:1;font-weight:700}.toc button .ti{flex:none;font-size:.78rem;color:var(--faint)}
.toc button.cur{border-color:var(--accent);background:var(--tint)}
.toc button.empty .ti{color:var(--warn)}
.toc button[disabled]{opacity:.45}
.done .toc{text-align:left;margin-top:1.2rem}.done .toc-h{text-align:left;font-weight:800;margin-top:1.4rem;color:var(--ink)}
.nav-x{margin-top:.8rem;width:100%;min-height:3rem;border-radius:.9rem;border:1.5px solid var(--line);background:#fff;font:inherit;font-weight:800;color:var(--soft)}
.foot{padding:.5rem 1rem calc(.5rem + env(safe-area-inset-bottom))}
.foot .btn{min-height:3rem}
body.kb .foot,body.kb .saved{display:none}
html:not(.big) .chip{font-size:17px}

/* 2026-10-22 헤더 정리: 진행바 제거, 가운데 단계 숫자, 헤더는 글씨 크게 영향 없음(px 고정) */
.prog{display:none}
.top .bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:10px 16px}
.top .grow{min-width:0}
.top .clinic{font-size:13px;letter-spacing:.04em}
.top .ttl{font-size:17px;line-height:1.25;word-break:keep-all}
.top .right{display:flex;justify-content:flex-end;align-items:center;gap:6px}
.fontbtn{font-size:14px;padding:5px 10px;border-radius:10px;border-width:1.5px}
.top .stepno{font-size:16px;line-height:1.2;color:#555555;padding:0;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.top .stepno button{font:inherit;font-size:16px;color:#555555;text-decoration:none;padding:4px 6px;border:none;background:none}
.kz-home{font-size:13px!important;padding:4px 8px!important;margin-left:0!important}
</style>
<script src="/tablet/kiosk.js"></script>
</head>
<body>
<header class="top">
  <div class="bar">
    <div class="grow"><div class="clinic">구월경희한의원</div><div class="ttl">한약 문진표</div></div>
    <div class="stepno" id="stepNo"></div>
    <div class="right"><button class="fontbtn" id="fontBtn" aria-pressed="false">글씨 크게</button></div>
  </div>
  <div class="prog"><i id="progBar"></i></div>
</header>
<main id="app"></main>
<div class="foot"><div class="in" id="foot"></div></div>
<div class="saved" id="saved">✓ 자동 저장됨</div>

<script>
// ---------------- 질문 데이터 ----------------
// r 하나만 / c 여러 개 / t 짧은 답 / p 긴 답 / s 0~10
const BODY=['손','발','가슴','얼굴','뒷머리','뒷목','어깨','등','옆구리','허리','아랫배','엉덩이','온몸','뼛속'];
const SECTIONS=[
 {no:'1',title:'가장 불편한 증상',hint:'편하게 적어 주세요.',items:[

  ['p','언제부터 시작됐고, 어떻게 변해 왔나요?'],
  ['c','증상이 더 심해지는 시간',['새벽','오전','오후','한밤']],
  ['c','증상이 더 심해지는 날씨',['흐릴 때','건조할 때','추울 때','더울 때']],
  ['c','증상이 더 심해지는 계절',['봄','여름','가을','겨울','환절기']],
  ['c','증상이 더 심해지는 상황',['신경 쓸 때','피곤할 때','밥 먹은 후','배고플 때','생리 전','생리 후']],
  ['c','그 밖에 해당하는 것',['아픈 곳이나 증상이 수시로 바뀐다']]]},
 {no:'2',title:'드시는 약 · 앓았던 병',hint:'없으면 비워 두세요.',items:[
  ['p','현재 드시는 약 · 건강기능식품'],
  ['p','수술 · 큰 병 이력']]},
 {no:'3',title:'식사 · 식욕',items:[
  ['r','식욕',['좋다','보통이다','최근에 줄었다','없다']],
  ['t','한 끼 식사량','예: 아침 거름 / 점심 1공기 / 저녁 반 공기'],
  ['c','간식 · 야식',['간식을 먹는다','야식을 먹는다']],

  ['r','물 마시는 방식',['벌컥벌컥','조금씩']],

  ['c','물을 마시는 이유',['목이 말라서','건강에 좋다고 해서','습관적으로']],

  ['t','소화가 안 된다면 일주일에 몇 번?','예: 3번'],
  ['c','자주 나오는 것',['트림','방귀']],
  ['c','식후 배가 빵빵해지는 곳',['윗배','아랫배','배 전체']],
  ['c','식후 아픈 곳',['가슴','명치','윗배','아랫배']],
  ['c','식후 몸 상태',['눕고 싶다','나른하다','졸리다']],
  ['c','속 쓰린 때',['식후','빈속일 때','새벽','저녁']],

 {no:'7',title:'소변',items:[

 {no:'8',title:'땀',items:[

  ['r','땀 냄새',['심하다','약간 있다','없다']],
  ['c','땀 나는 곳',['온몸','머리','얼굴','가슴','뒷목','등','겨드랑이','손','발','사타구니','다리']],

function chip(id,val,radio,label){

}

    h+=`<input class="txt" data-id="${esc(id)}" value="${esc(A[id]||'')}" placeholder="${esc(x||'')}" enterkeyhint="done">`;

    h+=`<textarea class="txt" data-id="${esc(id)}" placeholder="편하게 적어 주세요">${esc(A[id]||'')}</textarea>`;

}

    h+=textQ('기본. 성명','성명',true,'홍길동');
    h+=textQ('기본. 생년월일','생년월일',true,'예: 1975.03.12','numeric');
    h+=`<div class="q" data-q="기본. 성별"><h3>성별<span class="req">필수</span></h3><div class="opts">${chip('기본. 성별','남',true)}${chip('기본. 성별','여',true)}</div></div>`;
    h+=textQ('기본. 직업','직업',false,'예: 회사원, 주부');
    h+=textQ('기본. 키','키 (cm)',false,'예: 165','decimal');
    h+=textQ('기본. 몸무게','몸무게 (kg)',false,'예: 58','decimal');
  }else if(s.kind==='sec'){
    const sec=s.sec;
    h+=`<div class="sec-h"><div class="no">${sec.no}</div><h2>${esc(sec.title)}</h2>${sec.hint?`<p>${esc(sec.hint)}</p>`:''}</div>`;
    h+=sec.items.map(it=>item(sec.no,it)).join('');
  }else if(s.kind==='pers'){
    h+=`<div class="sec-h"><div class="no">19</div><h2>평소 성격</h2><p>요즘 상태보다 <b>원래의 내 성격</b>을 떠올려 주세요. 나와 가까운 것을 모두 고르시면 됩니다. 해당 없으면 비워 두셔도 됩니다.</p></div>`;
    PERS.forEach(([q,a,b])=>{const id=qid('19',q);
      h+=`<div class="q"><h3>${esc(q)}</h3><div class="sub">나와 가까운 것 모두 선택</div><div class="opts col">`+a.concat(b).map(o=>chip(id,o,false)).join('')+`</div></div>`;});
  }else if(s.kind==='emo'){
    h+=`<div class="sec-h"><div class="no">20</div><h2>나의 감정</h2><p>나와 <b>가장 가까운 것 2~3개는 '가깝다'</b>, <b>가장 먼 것 2~3개는 '멀다'</b>를 눌러 주세요. 나머지는 비워 두시면 됩니다.</p></div><div class="q emo">`;
    EMO.forEach(([n,d])=>{const id=qid('20',n);
      h+=`<div class="row"><div class="name">${esc(n)}</div><div class="desc">${esc(d)}</div><div class="btns"><button class="near" data-emo="${esc(id)}" data-v="가깝다" aria-pressed="${A[id]==='가깝다'}">가깝다</button><button class="far" data-emo="${esc(id)}" data-v="멀다" aria-pressed="${A[id]==='멀다'}">멀다</button></div></div>`;});
    const c=k=>EMO.filter(([n])=>A[qid('20',n)]===k).length;
    h+=`<div class="count">가깝다 ${c('가깝다')}개 · 멀다 ${c('멀다')}개 선택됨</div></div>`;
  }else if(s.kind==='finish'){
    h+=`<div class="done"><div class="ok">✓</div><h2>거의 다 되었습니다</h2><p>아래 <b>[제출하기]</b>를 눌러야 한의원으로 전달됩니다.<br>고칠 곳이 있으면 아래 목록에서 눌러 바로 가실 수 있습니다.</p><p style="margin-top:1rem;font-size:.85rem">응답한 항목 ${answeredCount()}개</p><div class="msg" id="sendMsg"></div><div class="toc-h">항목별 확인·수정</div>${NAVTOC()}</div>`;
  }else if(s.kind==='sent'){
    h+=`<div class="done"><div class="ok">✓</div><h2>제출되었습니다</h2><p>작성해 주셔서 감사합니다.<br>진료실에서 뵙겠습니다.</p></div>`;
  }
  $('#app').innerHTML=h;
  renderFoot();
  window.scrollTo(0,0);
}
function textQ(id,title,req,ph,mode){
  return `<div class="q" data-q="${esc(id)}"><h3>${esc(title)}${req?'<span class="req">필수</span>':''}</h3><input class="txt" data-id="${esc(id)}" value="${esc(A[id]||'')}" placeholder="${esc(ph||'')}"${mode?` inputmode="${mode}"`:''} enterkeyhint="done"></div>`;
}
function renderFoot(){
  const s=STEPS[step], f=$('#foot');
  if(s.kind==='sent'){f.className='in solo';f.innerHTML='';f.parentNode.style.display='none';return}
  f.parentNode.style.display='';
  if(s.kind==='intro'){f.className='in solo';f.innerHTML=`<button class="btn pri" id="next">시작하기</button>`;return}
  f.className='in';
  f.innerHTML=`<button class="btn sec" id="prev">이전</button>`+(s.kind==='finish'?`<button class="btn pri" id="submit">제출하기</button>`:(NAV.fromFin&&s.kind!=='basic')?`<button class="btn pri" id="toFin">확인 화면으로 →</button>`:`<button class="btn pri" id="next">다음</button>`);
}


// ---------------- 목차 이동 ----------------
var MAXS=0;
const NAV={fromFin:false,
  ids(s){if(s.kind==='basic')return ['기본. 동의','기본. 성명','기본. 생년월일','기본. 성별','기본. 직업','기본. 키','기본. 몸무게'];
    if(s.kind==='sec')return s.sec.items.map(it=>qid(s.sec.no,it[1]));
    if(s.kind==='pers')return PERS.map(p=>qid('19',p[0]));if(s.kind==='emo')return EMO.map(e=>qid('20',e[0]));return []},
  title(s){return s.kind==='basic'?'기본 정보':s.kind==='sec'?`${s.sec.no}. ${s.sec.title}`:s.kind==='pers'?'19. 평소 성격':'20. 나의 감정'},
  list(){return visibleSteps().filter(i=>['basic','sec','pers','emo'].includes(STEPS[i].kind)).map(i=>{const s=STEPS[i];const n=NAV.ids(s).filter(id=>{const v=A[id];return Array.isArray(v)?v.length:String(v||'').trim()}).length;return {i,t:NAV.title(s),n}})},
  fin(){return STEPS.findIndex(s=>s.kind==='finish')},
  jump(i){if(STEPS[step].kind==='basic'&&!validateBasic())return;step=i;save();render()}
};
document.addEventListener('click',e=>{if(e.target.closest('#toFin')){e.stopPropagation();NAV.jump(NAV.fin())}},true);
// ---------------- 이동 ----------------
function go(dir){
  let i=step+dir;
  while(i>0&&i<STEPS.length-1&&!visible(i))i+=dir;
  step=Math.max(0,Math.min(STEPS.length-1,i));save();render();
}
function validateBasic(){
  const need=[['기본. 동의',v=>v==='동의합니다'],['기본. 성명',v=>String(v||'').trim()],['기본. 생년월일',v=>String(v||'').trim()],['기본. 성별',v=>v]];
  let first=null;document.querySelectorAll('.q.err').forEach(e=>e.classList.remove('err'));
  need.forEach(([id,ok])=>{if(!ok(A[id])){const el=document.querySelector(`.q[data-q="${id}"]`);el&&el.classList.add('err');first=first||el;}});
  if(first){first.scrollIntoView({behavior:'smooth',block:'center'});return false}
  return true;
}

// ---------------- 이벤트 ----------------
document.addEventListener('click',e=>{
  const c=e.target.closest('.chip');
  if(c){const id=c.dataset.id,v=c.dataset.v;
    if(c.dataset.r==='1'){A[id]=A[id]===v?'':v;c.parentNode.querySelectorAll('.chip').forEach(x=>x.setAttribute('aria-pressed',A[id]===x.dataset.v));
      if(id==='기본. 성별'||id==='기본. 동의'){const q=c.closest('.q');q&&q.classList.remove('err')}}
    else{const arr=Array.isArray(A[id])?A[id]:[];const k=arr.indexOf(v);k<0?arr.push(v):arr.splice(k,1);A[id]=arr;c.setAttribute('aria-pressed',k<0);}
    save(true);return}
  const sc=e.target.closest('[data-scale]');
  if(sc){const id=sc.dataset.scale;A[id]=A[id]===sc.dataset.v?'':sc.dataset.v;sc.parentNode.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',A[id]===b.dataset.v));save(true);return}
  const em=e.target.closest('[data-emo]');
  if(em){const id=em.dataset.emo;A[id]=A[id]===em.dataset.v?'':em.dataset.v;save(true);const y=window.scrollY;render();window.scrollTo(0,y);return}
  const t=e.target.closest('button');if(!t)return;
  if(t.id==='next'){if(STEPS[step].kind==='basic'&&!validateBasic())return;if(KZ.on&&STEPS[step].kind==='basic')KZ.setPatient({consent:true,name:A['기본. 성명'],dob:A['기본. 생년월일'],sex:A['기본. 성별']});if(!sid)sid=Date.now().toString(36)+Math.random().toString(36).slice(2,7);go(1)}
  else if(t.id==='prev')go(-1);
  else if(t.id==='resume'){const d=load();A=d.A||{};sid=d.sid||'';step=Math.max(1,d.step||1);MAXS=Math.max(step,d.mx||0);render.resumed=true;render()}
  else if(t.id==='restart'){clearSaved();A={};sid='';step=0;MAXS=0;NAV.fromFin=false;render.resumed=true;render()}
  else if(t.id==='submit')submit(t);
  else if(t.id==='fontBtn'){const on=document.body.classList.toggle('big');t.setAttribute('aria-pressed',on);try{localStorage.setItem(KEY+'_big',on?'1':'')}catch(_){}}
});
document.addEventListener('input',e=>{const el=e.target.closest('[data-id]');if(!el)return;A[el.dataset.id]=el.value;const q=el.closest('.q');q&&q.classList.remove('err');clearTimeout(document.t);document.t=setTimeout(()=>save(true),500)});

// ---------------- 제출 ----------------
function buildRows(){
  const rows=[['제출ID',sid],...(KZ.on?[['차트번호',KZ.chart()],['작성 장소','원내 태블릿']]:[]),['성명',A['기본. 성명']||''],['생년월일',A['기본. 생년월일']||''],['성별',A['기본. 성별']||''],['직업',A['기본. 직업']||''],['키',A['기본. 키']||''],['몸무게',A['기본. 몸무게']||''],['개인정보 동의',A['기본. 동의']||'']];
  const val=v=>Array.isArray(v)?v.join(', '):(v==null?'':String(v));
  SECTIONS.forEach(sec=>sec.items.forEach(([,title])=>{const id=qid(sec.no,title);rows.push([sec.no+'. '+sec.title+' | '+title,val(A[id])])}));
  let yang=0,yin=0;
  PERS.forEach(([q,a,b])=>{const v=A[qid('19',q)]||[];yang+=v.filter(x=>a.includes(x)).length;yin+=v.filter(x=>b.includes(x)).length;rows.push(['19. 평소 성격 | '+q,val(v)])});
  rows.push(['19. 평소 성격 | 陽 선택 수',yang],['19. 평소 성격 | 陰 선택 수',yin]);
  rows.push(['20. 나의 감정 | 가깝다',EMO.filter(([n])=>A[qid('20',n)]==='가깝다').map(([n])=>n).join(', ')]);
  rows.push(['20. 나의 감정 | 멀다',EMO.filter(([n])=>A[qid('20',n)]==='멀다').map(([n])=>n).join(', ')]);
  return rows;
}
function submit(btn){
  const msg=$('#sendMsg');btn.disabled=true;btn.textContent='보내는 중…';msg.textContent='';
  const fail=()=>{btn.disabled=false;btn.textContent='다시 제출하기';msg.textContent='전송이 안 됐습니다. 인터넷 연결을 확인하고 다시 눌러 주세요. 작성 내용은 그대로 저장되어 있습니다.'};
  const ok=()=>{clearSaved();$('#saved').classList.remove('on');clearTimeout(document.t);step=STEPS.length;STEPS.push({kind:'sent'});render();if(KZ.on)KZ.done($('#app'))};
  if(window.__mockSubmit){window.__mockSubmit(buildRows())?ok():fail();return}
  fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({rows:buildRows()})})
    .then(r=>r.json()).then(j=>j&&j.ok?ok():fail()).catch(fail);
}

try{history.scrollRestoration='manual'}catch(e){}
try{if(localStorage.getItem(KEY+'_big')){document.body.classList.add('big');$('#fontBtn').setAttribute('aria-pressed','true')}}catch(e){}
render();
</script>
<script>(function(){var s=function(){document.documentElement.classList.toggle('big',document.body.classList.contains('big'))};new MutationObserver(s).observe(document.body,{attributes:true,attributeFilter:['class']});s()})();</script>
<script>/* 목차 이동 · 키보드 열리면 하단 버튼 숨김 */
(function(){
  window.MAXS=window.MAXS||0;
  function tocHTML(){return '<div class="toc">'+NAV.list().map(o=>`<button data-jump="${o.i}" class="${o.i===step?'cur':''} ${o.n===0?'empty':''}" ${o.i>MAXS?'disabled':''}><span class="tn">${esc(o.t)}</span><span class="ti">${o.i>MAXS?'아직 안 봄':o.n===0?'비어 있음':'답 '+o.n+'개'}</span></button>`).join('')+'</div>'}
  window.NAVTOC=tocHTML;
  function open(){const ov=document.createElement('div');ov.className='nav-ov';ov.innerHTML=`<div class="nav-box"><h3>원하는 곳으로 이동</h3><div class="sub">이미 지나온 곳까지 바로 갈 수 있습니다. 답한 내용은 그대로 남아 있습니다.</div>${tocHTML()}<button class="nav-x">닫기</button></div>`;document.body.appendChild(ov);ov.addEventListener('click',e=>{if(e.target===ov||e.target.closest('.nav-x'))ov.remove()})}
  document.addEventListener('click',e=>{
    if(e.target.closest('#tocBtn')){open();return}
    const j=e.target.closest('[data-jump]');
    if(j&&!j.disabled){e.stopPropagation();const ov=document.querySelector('.nav-ov');ov&&ov.remove();NAV.jump(+j.dataset.jump)}
  },true);
  document.addEventListener('focusin',e=>{if(e.target.matches('input.txt,textarea.txt'))document.body.classList.add('kb')});
  document.addEventListener('focusout',e=>{if(e.target.matches('input.txt,textarea.txt'))setTimeout(()=>{if(!document.activeElement||!document.activeElement.matches('input.txt,textarea.txt'))document.body.classList.remove('kb')},120)});
})();
</script></body>
</html>
